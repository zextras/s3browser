services:
  s3browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: s3browser:latest
    container_name: s3browser
    ports:
      - "8080:8080"
    environment:
      # Spring ayarları
      SPRING_THYMELEAF_CACHE: "false"
      SERVER_PORT: "8080"
      # Upload limitleri (isteğe bağlı override)
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "2GB"
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "2GB"
      # Uygulama ayarları (isteğe bağlı override)
      APP_UPLOAD_MULTIPART_THRESHOLD_BYTES: "16777216"
      APP_UPLOAD_MULTIPART_PART_SIZE_BYTES: "8388608"
      APP_CONNECTIONS_STORE_FILE: "/app/data/connections.json"
    volumes:
      - s3browser-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null || wget -qO- http://localhost:8080/ 2>/dev/null | grep -q '.' && echo OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  s3browser-data:

