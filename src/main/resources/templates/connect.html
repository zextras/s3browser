<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>s3browser - Connection</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<h1>s3browser</h1>
<p class="muted">S3 Browser (Java 21 + Spring + AWS SDK v2)</p>

<div th:if="${error}" class="error" th:text="${error}"></div>
<div th:if="${success}" class="success" th:text="${success}"></div>

<div class="box">
    <strong>Endpoint:</strong> <span th:text="${connectionEndpoint}"></span>
    | <strong>Access Key:</strong> <span th:text="${connectionAccessKey}"></span>
    | <strong>Region:</strong> <span th:text="${connectionRegion}"></span>
</div>

<div class="box">
    <h2>Kayitli Baglantilar</h2>
    <table>
        <thead>
        <tr>
            <th>Baglanti</th>
            <th>Default Bucket</th>
            <th>Durum</th>
            <th>Islemler</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(connections)}">
            <td colspan="4" class="muted">Henuz kayitli baglanti yok</td>
        </tr>
        <tr th:each="conn : ${connections}">
            <td th:text="${conn.label}"></td>
            <td th:text="${conn.defaultBucket == null ? '-' : conn.defaultBucket}"></td>
            <td th:text="${conn.active ? 'Aktif' : '-'}"></td>
            <td>
                <a th:href="@{/connect(connectionId=${conn.connectionId})}">Formu Doldur</a>
                |
                <form style="display:inline-block;" th:action="@{/connections/select}" method="post">
                    <input type="hidden" name="connectionId" th:value="${conn.connectionId}">
                    <button type="submit" th:disabled="${conn.active}">Aktif Yap</button>
                </form>
                |
                <form style="display:inline-block;" th:action="@{/connections/{id}/disconnect(id=${conn.connectionId})}" method="post"
                      onsubmit="return confirm('Bu baglanti kaldirilacak. Emin misiniz?')">
                    <button type="submit">Kaldir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="box">
    <h2>Yeni Baglanti Ekle</h2>
    <form th:action="@{/connect}" th:object="${connectionForm}" method="post">
        <div class="row">
            <div class="col">
                <label>Region</label>
                <input type="text" th:field="*{region}" placeholder="eu-west-1">
            </div>
            <div class="col">
                <label>Endpoint Override (opsiyonel)</label>
                <input type="text" th:field="*{endpointOverride}" placeholder="http://localhost:9000">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Access Key ID (opsiyonel)</label>
                <input type="text" th:field="*{accessKeyId}">
            </div>
            <div class="col">
                <label>Secret Access Key (opsiyonel)</label>
                <input type="password" th:field="*{secretAccessKey}">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Session Token (opsiyonel)</label>
                <input type="password" th:field="*{sessionToken}">
            </div>
            <div class="col">
                <label>Varsayilan Bucket (opsiyonel)</label>
                <input type="text" th:field="*{defaultBucket}" placeholder="baglandiktan sonra direkt acilsin">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>
                    <input type="checkbox" th:field="*{forcePathStyle}">
                    Path-style access zorla (S3 uyumlu servisler icin)
                </label>
            </div>
        </div>

        <button type="submit">Baglan</button>
    </form>
</div>
</body>
</html>
