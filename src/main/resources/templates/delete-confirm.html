<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>s3browser - Delete Confirm</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<h1>Silme Onayi</h1>
<div th:if="${error}" class="error" th:text="${error}"></div>

<div class="box">
    <strong>Endpoint:</strong> <span th:text="${connectionEndpoint}"></span>
    | <strong>Access Key:</strong> <span th:text="${connectionAccessKey}"></span>
    | <strong>Region:</strong> <span th:text="${connectionRegion}"></span>
</div>

<div class="box">
    <p>Asagidaki dosya silinecek:</p>
    <p><strong th:text="${key}"></strong></p>

    <form th:action="@{|/buckets/${bucket}/delete|}" method="post">
        <input type="hidden" name="key" th:value="${key}">
        <input type="hidden" name="prefix" th:value="${prefix}">
        <input type="hidden" name="connectionId" th:value="${connectionId}">
        <label>
            <input type="checkbox" name="confirm" value="true">
            Evet, dosyayi silmek istiyorum.
        </label>
        <br><br>
        <button type="submit">Sil</button>
        <a th:href="@{/buckets/{bucket}(bucket=${bucket},prefix=${prefix},connectionId=${connectionId})}">Vazgec</a>
    </form>
</div>
</body>
</html>
