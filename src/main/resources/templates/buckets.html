<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>s3browser - Buckets</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<h1>Bucket Listesi</h1>
<div th:if="${success}" class="success" th:text="${success}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<div class="box">
    <strong>Endpoint:</strong> <span th:text="${connectionEndpoint}"></span>
    | <strong>Access Key:</strong> <span th:text="${connectionAccessKey}"></span>
    | <strong>Region:</strong> <span th:text="${connectionRegion}"></span>
</div>

<div class="box">
    <a th:href="@{/connect(connectionId=${connectionId})}">Baglanti Ayarlari</a>
    <form style="display:inline-block; margin-left:10px;" th:action="@{/disconnect}" method="post">
        <button type="submit">Tum Baglantilari Temizle</button>
    </form>
</div>

<div class="box">
    <h3>Bucket Olustur</h3>
    <form th:action="@{/buckets/create}" method="post">
        <input type="hidden" name="connectionId" th:value="${connectionId}">
        <input type="text" name="bucketName" placeholder="ornek-bucket-adi" required>
        <button type="submit">Olustur</button>
    </form>
</div>

<div class="box">
    <table>
        <thead>
        <tr>
            <th>Bucket</th>
            <th>Olusturulma</th>
            <th>Islem</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bucket : ${buckets}">
            <td><a th:href="@{/buckets/{bucket}(bucket=${bucket.name},connectionId=${connectionId})}" th:text="${bucket.name}"></a></td>
            <td th:text="${bucket.createdAt}"></td>
            <td><a th:href="@{/buckets/delete(bucketName=${bucket.name},connectionId=${connectionId})}">Sil</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
